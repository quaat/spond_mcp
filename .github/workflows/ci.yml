name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Byte-compile sources and tests
        run: python -m compileall -q src tests

      - name: Run tests
        env:
          # Tests must run without real Spond credentials. Make this explicit
          # so a misconfigured runner cannot accidentally use a leaked token.
          SPOND_USERNAME: ""
          SPOND_PASSWORD: ""
          SPOND_MCP_READ_ONLY: "true"
        run: pytest -q
